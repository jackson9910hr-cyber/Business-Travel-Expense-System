<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>출장/외근비 영수증</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    color-scheme: light;
    --bg-0:#e9edf5;
    --bg-1:#dfe5f0;
    --paper:#fffdf8;
    --paper-edge:#e7e1d2;
    --ink:#2b2f38;
    --ink-soft:#6b7280;
    --line:#e4e0d3;
    --accent:#2f6fed;
    --accent-ink:#ffffff;
    --transport:#2f6fed;
    --lodging:#7c5cff;
    --meal:#f2994a;
    --etc:#12a594;
    --danger:#e0473e;
    --danger-soft:#fdeceb;
    --btn-bg:#ffffff;
    --btn-ink:#2b2f38;
    --btn-border:#dfe1e8;
    --shadow-card: 0 10px 24px -12px rgba(43,47,56,.28);
    --shadow-paper: 0 24px 60px -24px rgba(43,47,56,.35);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-0:#14161c;
      --bg-1:#1b1e26;
      --paper:#fffdf8;
      --paper-edge:#e7e1d2;
      --ink:#2b2f38;
      --ink-soft:#6b7280;
      --line:#e4e0d3;
      --btn-bg:#242732;
      --btn-ink:#eef0f5;
      --btn-border:#343846;
      --danger-soft:#3a2220;
    }
  }
  :root[data-theme="dark"]{
    --bg-0:#14161c;
    --bg-1:#1b1e26;
    --paper:#fffdf8;
    --paper-edge:#e7e1d2;
    --ink:#2b2f38;
    --ink-soft:#6b7280;
    --line:#e4e0d3;
    --btn-bg:#242732;
    --btn-ink:#eef0f5;
    --btn-border:#343846;
    --danger-soft:#3a2220;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--bg-1), transparent),
      var(--bg-0);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    min-height:100%;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  img{max-width:100%;}
  [hidden]{display:none !important;}

  .shell{
    max-width:840px;
    margin:0 auto;
    padding: 28px 18px 40px;
  }

  .masthead{
    text-align:center;
    margin-bottom:18px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:700;
  }
  h1{
    font-family:'Gowun Dodum', 'Noto Sans KR', sans-serif;
    font-size:clamp(26px,5vw,34px);
    margin:4px 0 0;
    text-wrap:balance;
    font-weight:400;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin:20px 0 22px;
  }
  .toolbar button{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:10px 16px;
    border-radius:999px;
    border:1px solid var(--btn-border);
    background:var(--btn-bg);
    color:var(--btn-ink);
    font-size:14px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    box-shadow:0 2px 6px -3px rgba(0,0,0,.18);
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .toolbar button:hover{transform:translateY(-1px);box-shadow:0 6px 14px -6px rgba(0,0,0,.28);}
  .toolbar button:active{transform:translateY(0);}
  .toolbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .toolbar button.icon{font-size:16px;}
  #btnAdd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  #btnDelete.active{background:var(--danger);border-color:var(--danger);color:#fff;}
  #btnReorder.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .paper-wrap{
    perspective:1200px;
  }
  .paper{
    background:var(--paper);
    color:#20232b;
    border-radius:6px;
    box-shadow:var(--shadow-paper);
    border:1px solid var(--paper-edge);
    padding:22px 20px 28px;
    position:relative;
  }
  .paper::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px dashed #e7e0cf;
    border-radius:3px;
    pointer-events:none;
  }

  .summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:0;
    margin:6px 4px 20px;
    border:1px solid #ece6d6;
    border-radius:8px;
    overflow:hidden;
    background:#fffef9;
  }
  .summary-item{
    padding:12px 6px;
    text-align:center;
    border-right:1px dashed #e5deca;
    position:relative;
  }
  .summary-item:last-child{border-right:none;}
  .summary-item .dot{
    width:8px;height:8px;border-radius:50%;
    display:inline-block;margin-right:5px;
  }
  .summary-item .cat-name{
    font-size:11px;color:var(--ink-soft);font-weight:700;
    letter-spacing:.02em;
  }
  .summary-item .cat-sum{
    display:block;margin-top:4px;
    font-size:15px;font-weight:900;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
  }
  .summary-total{
    grid-column:1 / -1;
    display:flex;justify-content:space-between;align-items:baseline;
    padding:12px 16px;
    background:var(--ink);
    color:#fff;
  }
  .summary-total .t-label{font-size:13px;font-weight:700;letter-spacing:.04em;}
  .summary-total .t-value{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:22px 16px;
    min-height:120px;
  }

  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-size:14px;
    border:1.5px dashed #ddd6c2;
    border-radius:10px;
  }
  .empty-state .big{font-size:30px;display:block;margin-bottom:6px;}

  .card{
    position:relative;
    background:#fff;
    border-radius:4px;
    box-shadow:var(--shadow-card);
    padding:8px 8px 10px;
    cursor:pointer;
    transform:rotate(var(--rot,0deg));
    transition:transform .15s ease, box-shadow .15s ease;
    border:1px solid #efece2;
  }
  .card:hover{transform:rotate(var(--rot,0deg)) translateY(-3px) scale(1.02);box-shadow:0 16px 28px -14px rgba(43,47,56,.38);}
  .card .tape{
    position:absolute;
    top:-10px;left:50%;
    width:56px;height:20px;
    background:linear-gradient(180deg, rgba(255,241,168,.9), rgba(255,231,120,.75));
    transform:translateX(-50%) rotate(-2deg);
    box-shadow:0 2px 4px rgba(0,0,0,.12);
    opacity:.9;
  }
  .card .photo-frame{
    border-radius:2px;
    background:#f2f1ec;
    line-height:0;
  }
  .card img{
    width:100%;height:auto;display:block;border-radius:2px;
  }
  .card .tag{
    margin-top:7px;
    font-size:12px;
    font-weight:700;
    text-align:center;
    color:var(--ink-soft);
  }
  .card .tag.set{
    color:#fff;
    background:var(--cat-color, var(--ink-soft));
    border-radius:5px;
    padding:4px 6px;
    font-variant-numeric:tabular-nums;
  }

  .card .checkbox{
    position:absolute;top:6px;right:6px;
    width:24px;height:24px;border-radius:50%;
    background:#fff;border:2px solid var(--danger);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;font-weight:900;
    z-index:2;
  }
  .card.selected{outline:3px solid var(--danger);outline-offset:2px;border-radius:6px;}
  .card.selected .checkbox{background:var(--danger);}
  .card.selected .photo-frame{filter:brightness(.85);}

  .card .drag-handle{
    position:absolute;top:6px;right:6px;
    width:26px;height:26px;border-radius:50%;
    background:rgba(43,47,56,.85);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;z-index:2;cursor:grab;
  }
  .reorder-mode .card{cursor:grab;}
  .reorder-mode .card.sortable-ghost{opacity:.35;}

  .delete-bar{
    position:sticky;
    bottom:calc(14px + env(safe-area-inset-bottom, 0px));
    z-index:20;
    margin:18px auto 0;
    max-width:420px;
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:space-between;
    background:var(--ink);
    color:#fff;
    padding:12px 14px;
    border-radius:14px;
    box-shadow:0 14px 30px -10px rgba(0,0,0,.45);
  }
  .delete-bar span{font-size:13px;font-weight:700;}
  .delete-bar .actions{display:flex;gap:8px;}
  .delete-bar button{
    border:none;border-radius:999px;padding:9px 14px;
    font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .delete-bar .confirm{background:var(--danger);color:#fff;}
  .delete-bar .cancel{background:#3c3f49;color:#fff;}

  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(20,20,24,.55);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal{
    background:var(--btn-bg);
    color:var(--btn-ink);
    width:100%;max-width:360px;
    border-radius:16px;
    padding:18px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
    max-height:90vh;
    overflow-y:auto;
  }
  .modal.small{max-width:300px;}
  .modal h3{margin:0 0 14px;font-size:16px;font-family:'Gowun Dodum',sans-serif;font-weight:400;}
  .modal-img-wrap{
    width:100%;max-height:46vh;border-radius:10px;overflow:hidden;
    background:#eee;margin-bottom:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-img-wrap img{width:100%;max-height:46vh;object-fit:contain;display:block;}
  .cat-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;
  }
  .cat-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 6px;border-radius:10px;
    border:2px solid var(--btn-border);
    background:transparent;color:var(--btn-ink);
    font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  }
  .cat-btn[data-cat="교통비"]{ --cc: var(--transport); }
  .cat-btn[data-cat="숙박비"]{ --cc: var(--lodging); }
  .cat-btn[data-cat="식비"]{ --cc: var(--meal); }
  .cat-btn[data-cat="기타비용"]{ --cc: var(--etc); }
  .cat-btn.active{background:var(--cc);border-color:var(--cc);color:#fff;}

  .amount-row{
    display:flex;align-items:center;
    border:2px solid var(--btn-border);
    border-radius:10px;
    padding:4px 4px 4px 14px;
    margin-bottom:16px;
  }
  .amount-row input{
    flex:1;border:none;background:transparent;
    font-size:18px;font-weight:800;padding:9px 4px;
    font-family:inherit;color:var(--btn-ink);
    font-variant-numeric:tabular-nums;
    min-width:0;
  }
  .amount-row input:focus{outline:none;}
  .amount-row .won{font-size:14px;color:var(--ink-soft);font-weight:700;padding-right:8px;}

  .modal-actions{display:flex;gap:8px;}
  .modal-actions button{
    flex:1;border:none;border-radius:10px;padding:12px;
    font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:var(--danger-soft);color:var(--danger);}
  .btn-plain{background:#eee;color:var(--btn-ink);}

  .share-actions{display:flex;flex-direction:column;gap:8px;}
  .share-actions button{
    display:flex;align-items:center;gap:10px;
    padding:13px 14px;border-radius:10px;border:1px solid var(--btn-border);
    background:transparent;color:var(--btn-ink);font-family:inherit;
    font-size:14px;font-weight:700;cursor:pointer;text-align:left;
  }
  .share-actions button:hover{background:rgba(0,0,0,.04);}
  .share-actions .close-row{margin-top:4px;background:none;border:none;color:var(--ink-soft);justify-content:center;}

  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);
    background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:999px;
    font-size:13px;font-weight:700;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.4);
    z-index:80;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  footer.hint{
    text-align:center;color:var(--ink-soft);font-size:12px;margin-top:16px;
  }

  @media (max-width:480px){
    .summary{grid-template-columns:repeat(2,1fr);}
    .summary-item:nth-child(2){border-right:none;}
    .summary-item:nth-child(1),.summary-item:nth-child(2){border-bottom:1px dashed #e5deca;}
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="masthead">
      <div class="eyebrow">Business Travel &amp; Field Expense</div>
      <h1>출장/외근비 영수증</h1>
    </div>

    <div class="toolbar">
      <button id="btnAdd" class="icon" type="button">📎 영수증 첨부</button>
      <button id="btnDelete" class="icon" type="button">🗑️ 영수증 삭제</button>
      <button id="btnShare" class="icon" type="button">📤 캡쳐/공유</button>
      <button id="btnReorder" class="icon" type="button">↕️ 사진순서변경</button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
    </div>

    <div class="paper-wrap">
      <div class="paper" id="paper">
        <div class="summary" id="summary">
          <div class="summary-item">
            <span class="cat-name"><span class="dot" style="background:var(--transport)"></span>교통비</span>
            <span class="cat-sum" id="sum-교통비">0원</span>
          </div>
          <div class="summary-item">
            <span class="cat-name"><span class="dot" style="background:var(--lodging)"></span>숙박비</span>
            <span class="cat-sum" id="sum-숙박비">0원</span>
          </div>
          <div class="summary-item">
            <span class="cat-name"><span class="dot" style="background:var(--meal)"></span>식비</span>
            <span class="cat-sum" id="sum-식비">0원</span>
          </div>
          <div class="summary-item">
            <span class="cat-name"><span class="dot" style="background:var(--etc)"></span>기타비용</span>
            <span class="cat-sum" id="sum-기타비용">0원</span>
          </div>
          <div class="summary-total">
            <span class="t-label">총 합계</span>
            <span class="t-value" id="sum-total">0원</span>
          </div>
        </div>

        <div class="grid" id="grid">
          <div class="empty-state" id="emptyState">
            <span class="big">🧾</span>
            영수증 첨부 버튼을 눌러 사진을 추가해주세요
          </div>
        </div>
      </div>
    </div>

    <footer class="hint">사진을 탭하면 항목/금액을 입력할 수 있어요 · 새로고침하면 내용이 초기화되니, 작성 후 캡쳐/공유로 미리 저장해두세요</footer>
  </div>

  <div class="delete-bar" id="deleteBar" hidden>
    <span id="deleteCount">0개 선택</span>
    <div class="actions">
      <button class="cancel" id="btnCancelDelete" type="button">취소</button>
      <button class="confirm" id="btnConfirmDelete" type="button">삭제</button>
    </div>
  </div>

  <div class="modal-overlay" id="editModal" hidden>
    <div class="modal">
      <h3>영수증 내용 입력</h3>
      <div class="modal-img-wrap"><img id="modalImg" alt="영수증 사진" /></div>
      <div class="cat-grid" id="catGrid">
        <button class="cat-btn" data-cat="교통비" type="button">🚗 교통비</button>
        <button class="cat-btn" data-cat="숙박비" type="button">🏨 숙박비</button>
        <button class="cat-btn" data-cat="식비" type="button">🍚 식비</button>
        <button class="cat-btn" data-cat="기타비용" type="button">📦 기타비용</button>
      </div>
      <div class="amount-row">
        <input type="number" id="amountInput" inputmode="numeric" placeholder="금액 입력" min="0" />
        <span class="won">원</span>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="btnCloseModal" type="button">닫기</button>
        <button class="btn-primary" id="btnSaveReceipt" type="button">저장</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="shareModal" hidden>
    <div class="modal small">
      <h3>캡쳐/공유</h3>
      <div class="share-actions">
        <button id="actShare" type="button">📤 공유하기</button>
        <button id="actSaveImg" type="button">🖼️ 이미지로 저장</button>
        <button id="actSavePdf" type="button">📄 PDF로 저장</button>
        <button class="close-row" id="btnCloseShare" type="button">닫기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var CATS = ["교통비","숙박비","식비","기타비용"];
  var CAT_VAR = {"교통비":"--transport","숙박비":"--lodging","식비":"--meal","기타비용":"--etc"};

  // Every open/refresh starts blank by design (each trip is a fresh sheet) —
  // receipts live only in memory for this page session, never persisted.
  // Drop any data cached by an older version of this app that did persist.
  try{ localStorage.removeItem("travelExpenseReceipts_v1"); }catch(e){}

  var receipts = [];
  var mode = "normal"; // normal | delete | reorder
  var selectedForDelete = new Set();
  var activeReceiptId = null;
  var sortableInstance = null;

  var grid = document.getElementById("grid");
  var emptyState = document.getElementById("emptyState");
  var fileInput = document.getElementById("fileInput");
  var deleteBar = document.getElementById("deleteBar");
  var deleteCountEl = document.getElementById("deleteCount");
  var editModal = document.getElementById("editModal");
  var modalImg = document.getElementById("modalImg");
  var amountInput = document.getElementById("amountInput");
  var catGrid = document.getElementById("catGrid");
  var shareModal = document.getElementById("shareModal");
  var toastEl = document.getElementById("toast");
  var paperEl = document.getElementById("paper");

  var btnAdd = document.getElementById("btnAdd");
  var btnDelete = document.getElementById("btnDelete");
  var btnShare = document.getElementById("btnShare");
  var btnReorder = document.getElementById("btnReorder");

  function uid(){
    return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }


  function fmtWon(n){
    return (n||0).toLocaleString("ko-KR") + "원";
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  function resizeImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          var maxDim = 2000;
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.95));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function seedRotation(){
    return (Math.random() * 6 - 3).toFixed(2);
  }

  function render(){
    grid.querySelectorAll(".card").forEach(function(c){ c.remove(); });
    emptyState.hidden = receipts.length > 0;

    receipts.forEach(function(r){
      var card = document.createElement("div");
      card.className = "card";
      card.dataset.id = r.id;
      if (r.rot === undefined) r.rot = seedRotation();
      card.style.setProperty("--rot", r.rot + "deg");

      var tape = document.createElement("div");
      tape.className = "tape";
      card.appendChild(tape);

      var frame = document.createElement("div");
      frame.className = "photo-frame";
      var img = document.createElement("img");
      img.src = r.dataUrl;
      img.alt = r.category ? (r.category + " 영수증") : "영수증 사진";
      frame.appendChild(img);
      card.appendChild(frame);

      var tag = document.createElement("div");
      if (r.category && r.amount != null){
        tag.className = "tag set";
        tag.style.setProperty("--cat-color", "var(" + CAT_VAR[r.category] + ")");
        tag.textContent = r.category + " / " + fmtWon(r.amount);
      } else {
        tag.className = "tag";
        tag.textContent = "탭하여 항목 입력";
      }
      card.appendChild(tag);

      if (mode === "delete"){
        var cb = document.createElement("div");
        cb.className = "checkbox";
        cb.textContent = selectedForDelete.has(r.id) ? "✓" : "";
        card.appendChild(cb);
        if (selectedForDelete.has(r.id)) card.classList.add("selected");
      } else if (mode === "reorder"){
        var handle = document.createElement("div");
        handle.className = "drag-handle";
        handle.textContent = "⠿";
        card.appendChild(handle);
      }

      card.addEventListener("click", function(){ onCardClick(r.id); });
      grid.appendChild(card);
    });

    renderSummary();
  }

  function renderSummary(){
    var totals = {"교통비":0,"숙박비":0,"식비":0,"기타비용":0};
    receipts.forEach(function(r){
      if (r.category && r.amount != null) totals[r.category] += Number(r.amount) || 0;
    });
    CATS.forEach(function(c){
      document.getElementById("sum-" + c).textContent = fmtWon(totals[c]);
    });
    var grand = CATS.reduce(function(s,c){ return s + totals[c]; }, 0);
    document.getElementById("sum-total").textContent = fmtWon(grand);
  }

  function onCardClick(id){
    if (mode === "delete"){
      if (selectedForDelete.has(id)) selectedForDelete.delete(id);
      else selectedForDelete.add(id);
      updateDeleteBar();
      render();
      return;
    }
    if (mode === "reorder") return;
    openEditModal(id);
  }

  // ---- Add receipts ----
  btnAdd.addEventListener("click", function(){
    if (mode !== "normal") exitModes();
    fileInput.value = "";
    fileInput.click();
  });

  fileInput.addEventListener("change", function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!files.length) return;
    Promise.all(files.map(resizeImage)).then(function(dataUrls){
      dataUrls.forEach(function(dataUrl){
        receipts.push({ id: uid(), dataUrl: dataUrl, category: null, amount: null, rot: seedRotation() });
      });
      render();
      showToast(files.length + "장 추가됨");
    }).catch(function(){
      showToast("사진을 불러오지 못했습니다");
    });
  });

  // ---- Edit modal (category + amount) ----
  var pendingCat = null;

  function openEditModal(id){
    var r = receipts.find(function(x){ return x.id === id; });
    if (!r) return;
    activeReceiptId = id;
    pendingCat = r.category || null;
    modalImg.src = r.dataUrl;
    amountInput.value = r.amount != null ? r.amount : "";
    catGrid.querySelectorAll(".cat-btn").forEach(function(b){
      b.classList.toggle("active", b.dataset.cat === pendingCat);
    });
    editModal.hidden = false;
  }

  catGrid.addEventListener("click", function(e){
    var btn = e.target.closest(".cat-btn");
    if (!btn) return;
    pendingCat = btn.dataset.cat;
    catGrid.querySelectorAll(".cat-btn").forEach(function(b){
      b.classList.toggle("active", b === btn);
    });
  });

  document.getElementById("btnCloseModal").addEventListener("click", closeEditModal);
  editModal.addEventListener("click", function(e){ if (e.target === editModal) closeEditModal(); });

  function closeEditModal(){
    editModal.hidden = true;
    activeReceiptId = null;
    pendingCat = null;
  }

  document.getElementById("btnSaveReceipt").addEventListener("click", function(){
    if (!activeReceiptId) return;
    var amt = amountInput.value;
    if (!pendingCat){ showToast("항목을 선택해주세요"); return; }
    if (amt === "" || Number(amt) < 0 || isNaN(Number(amt))){ showToast("금액을 입력해주세요"); return; }
    var r = receipts.find(function(x){ return x.id === activeReceiptId; });
    if (r){
      r.category = pendingCat;
      r.amount = Math.round(Number(amt));
      render();
    }
    closeEditModal();
  });

  // ---- Delete mode ----
  btnDelete.addEventListener("click", function(){
    if (mode === "delete"){ exitModes(); return; }
    exitModes();
    mode = "delete";
    btnDelete.classList.add("active");
    selectedForDelete.clear();
    deleteBar.hidden = false;
    updateDeleteBar();
    render();
  });

  function updateDeleteBar(){
    deleteCountEl.textContent = selectedForDelete.size + "개 선택";
  }

  document.getElementById("btnCancelDelete").addEventListener("click", exitModes);

  document.getElementById("btnConfirmDelete").addEventListener("click", function(){
    if (!selectedForDelete.size){ showToast("삭제할 영수증을 선택해주세요"); return; }
    var n = selectedForDelete.size;
    receipts = receipts.filter(function(r){ return !selectedForDelete.has(r.id); });
    exitModes();
    showToast(n + "장 삭제됨");
  });

  // ---- Reorder mode ----
  btnReorder.addEventListener("click", function(){
    if (mode === "reorder"){ exitModes(); return; }
    exitModes();
    mode = "reorder";
    btnReorder.classList.add("active");
    btnReorder.textContent = "✅ 순서변경 완료";
    grid.classList.add("reorder-mode");
    render();
    if (sortableInstance) sortableInstance.destroy();
    sortableInstance = new Sortable(grid, {
      animation: 180,
      ghostClass: "sortable-ghost",
      onEnd: function(){
        var ids = Array.prototype.slice.call(grid.querySelectorAll(".card")).map(function(c){ return c.dataset.id; });
        receipts.sort(function(a,b){ return ids.indexOf(a.id) - ids.indexOf(b.id); });
      }
    });
  });

  function exitModes(){
    mode = "normal";
    selectedForDelete.clear();
    deleteBar.hidden = true;
    btnDelete.classList.remove("active");
    btnReorder.classList.remove("active");
    btnReorder.textContent = "↕️ 사진순서변경";
    grid.classList.remove("reorder-mode");
    if (sortableInstance){ sortableInstance.destroy(); sortableInstance = null; }
    render();
  }

  // ---- Share / capture ----
  btnShare.addEventListener("click", function(){
    if (!receipts.length){ showToast("먼저 영수증을 첨부해주세요"); return; }
    exitModes();
    shareModal.hidden = false;
  });
  document.getElementById("btnCloseShare").addEventListener("click", function(){ shareModal.hidden = true; });
  shareModal.addEventListener("click", function(e){ if (e.target === shareModal) shareModal.hidden = true; });

  function dateStr(){
    var d = new Date();
    var p = function(n){ return String(n).padStart(2,"0"); };
    return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate());
  }

  function captureCanvas(){
    return html2canvas(paperEl, { scale: 2, backgroundColor: "#fffdf8", useCORS: true })
      .then(patchCanvasWithNativePhotos);
  }

  // html2canvas rasterizes photos at their on-screen thumbnail size, which
  // is much lower resolution than the stored original. After the screenshot,
  // redraw each full (uncropped) photo from its original <img> onto the
  // exact same rotated rect so captures/PDF/share keep native photo quality.
  // Cards render each photo at its own natural aspect ratio (no cropping),
  // so the frame's box already matches the source image's proportions.
  function patchCanvasWithNativePhotos(canvas){
    var paperRect = paperEl.getBoundingClientRect();
    if (!paperRect.width) return canvas;
    var pxRatio = canvas.width / paperRect.width;
    var ctx = canvas.getContext("2d");
    grid.querySelectorAll(".card").forEach(function(card){
      var r = receipts.find(function(x){ return x.id === card.dataset.id; });
      var frame = card.querySelector(".photo-frame");
      var imgEl = frame && frame.querySelector("img");
      if (!r || !imgEl || !imgEl.naturalWidth) return;
      var frameRect = frame.getBoundingClientRect();
      var centerX = (frameRect.left + frameRect.right) / 2;
      var centerY = (frameRect.top + frameRect.bottom) / 2;
      var localW = frame.offsetWidth;
      var localH = frame.offsetHeight;
      var rotRad = (parseFloat(r.rot) || 0) * Math.PI / 180;
      var destCenterX = (centerX - paperRect.left) * pxRatio;
      var destCenterY = (centerY - paperRect.top) * pxRatio;
      var destW = localW * pxRatio;
      var destH = localH * pxRatio;
      ctx.save();
      ctx.translate(destCenterX, destCenterY);
      ctx.rotate(rotRad);
      ctx.drawImage(imgEl, -destW / 2, -destH / 2, destW, destH);
      ctx.restore();
    });
    return canvas;
  }

  // Inside the Claude Artifact viewer, script-driven downloads (<a download>,
  // blob/data links) are inert, so files must be offered through the host's
  // downloads capability when it's present; plain <a download> is the fallback
  // for standalone/self-hosted use where window.claude is not injected.
  var claudeDownloadsPromise = null;
  function getClaudeDownloads(){
    if (claudeDownloadsPromise) return claudeDownloadsPromise;
    if (typeof window.claude === "undefined" || !window.claude.use){
      claudeDownloadsPromise = Promise.resolve(null);
    } else {
      claudeDownloadsPromise = window.claude.use("downloads").catch(function(){ return null; });
    }
    return claudeDownloadsPromise;
  }

  function fallbackDownload(filename, blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    showToast("저장 완료");
  }

  function saveFile(filename, blob){
    return getClaudeDownloads().then(function(dl){
      if (!dl){ fallbackDownload(filename, blob); return; }
      return dl.save({ filename: filename, data: blob }).then(function(res){
        showToast(res.status === "delivered" ? "공유 완료" : "저장 완료");
      }).catch(function(err){
        if (err && err.code === "declined") return;
        showToast("저장에 실패했습니다");
      });
    });
  }

  document.getElementById("actSaveImg").addEventListener("click", function(){
    shareModal.hidden = true;
    showToast("캡쳐 중...");
    captureCanvas().then(function(canvas){
      canvas.toBlob(function(blob){
        saveFile("출장비영수증_" + dateStr() + ".png", blob);
      }, "image/png");
    });
  });

  document.getElementById("actSavePdf").addEventListener("click", function(){
    shareModal.hidden = true;
    showToast("PDF 생성 중...");
    captureCanvas().then(function(canvas){
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF("p","mm","a4");
      var pageW = pdf.internal.pageSize.getWidth();
      var pageH = pdf.internal.pageSize.getHeight();
      var imgW = pageW;
      var imgH = canvas.height * imgW / canvas.width;
      var imgData = canvas.toDataURL("image/jpeg", 0.97);
      var heightLeft = imgH;
      var position = 0;
      pdf.addImage(imgData, "JPEG", 0, position, imgW, imgH);
      heightLeft -= pageH;
      while (heightLeft > 0){
        position = heightLeft - imgH;
        pdf.addPage();
        pdf.addImage(imgData, "JPEG", 0, position, imgW, imgH);
        heightLeft -= pageH;
      }
      var blob = pdf.output("blob");
      saveFile("출장비영수증_" + dateStr() + ".pdf", blob);
    });
  });

  document.getElementById("actShare").addEventListener("click", function(){
    shareModal.hidden = true;
    showToast("캡쳐 중...");
    captureCanvas().then(function(canvas){
      canvas.toBlob(function(blob){
        var filename = "출장비영수증_" + dateStr() + ".png";
        getClaudeDownloads().then(function(dl){
          if (!dl && navigator.canShare){
            var file = new File([blob], filename, { type: "image/png" });
            if (navigator.canShare({ files: [file] })){
              navigator.share({ files: [file], title: "출장/외근비 영수증" }).catch(function(){});
              return;
            }
          }
          saveFile(filename, blob);
        });
      }, "image/png");
    });
  });

  render();
})();
</script>
</body>
</html>
